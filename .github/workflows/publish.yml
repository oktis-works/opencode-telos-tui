name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for CI to complete and check result
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.payload.release.tag_name;
            
            // Get the commit SHA for the release tag
            const { data: ref } = await github.rest.git.getRef({
              owner, repo, ref: `tags/${tag}`
            });
            const sha = ref.object.sha;
            
            // Wait for CI to complete SUCCESSFULLY (poll for up to 10 minutes)
            const maxWaitMs = 10 * 60 * 1000;
            const pollIntervalMs = 15000;
            const startTime = Date.now();
            
            let ciRun = null;
            while (Date.now() - startTime < maxWaitMs) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                status: 'completed',
                per_page: 5
              });
              
              // Find a successful run for this commit
              const successRun = runs.workflow_runs.find(r => r.conclusion === 'success');
              if (successRun) {
                ciRun = successRun;
                break;
              }
              
              console.log(`Waiting for CI to complete successfully... (${Math.round((Date.now() - startTime) / 1000)}s elapsed)`);
              await new Promise(r => setTimeout(r, pollIntervalMs));
            }
            
            if (!ciRun) {
              core.setFailed('Timeout: CI did not complete successfully within 10 minutes');
              return;
            }
            
            console.log(`CI passed for ${sha} (run ${ciRun.id})`);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Update npm to latest for OIDC support
        run: npm install -g npm@latest

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public

      - name: Pack for release asset
        run: npm pack --pack-destination .

      - name: Upload tgz to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"